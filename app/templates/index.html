<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Selection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="my-4 text-center">Select a Workflow</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">RNAseq Workflow</h5>
                        <p class="card-text">Process RNA sequencing data with a standard pipeline.</p>
                        <a href="/execute/rnaseq" class="btn btn-primary">Run RNAseq</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">scRNAseq Workflow</h5>
                        <p class="card-text">Single-cell RNA sequencing data analysis.</p>
                        <a href="/execute/scrnaseq" class="btn btn-primary">Run scRNAseq</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Custom Workflow</h5>
                        <p class="card-text">Select parameters to define a custom workflow.</p>
                        <a href="/execute/custom" class="btn btn-primary">Run Custom Workflow</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
